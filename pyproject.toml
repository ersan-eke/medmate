[project]
name = "medmate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "av<19",
    "fastapi>=0.163.1",
    "faster-whisper>=1.2.1",
    "kokoro>=0.9.4",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "ollama>=0.6.3",
    "pydantic>=2.14.3",
    "python-multipart>=0.0.33",
    "rank-bm25>=0.2.2",
    "soundfile>=0.14.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: needs real models"]
addopts = "-m 'not slow'"
