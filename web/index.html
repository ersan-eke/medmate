<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MedMate</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; }
  #emergency { background: #c00; color: #fff; text-align: center; padding: .75rem; width: 100%; box-sizing: border-box; }
  #emergency strong { font-size: 2.5rem; display: block; }
  main { max-width: 40rem; margin: 1rem auto; padding: 0 1rem; }
  input { width: 100%; font-size: 1.1rem; padding: .5rem; box-sizing: border-box; }
  #answer { margin-top: 1rem; font-size: 1.2rem; white-space: pre-wrap; }
  #answer.emergency { color: #c00; font-weight: bold; }
  #card h2 { font-size: 1.1rem; margin: 1rem 0 .25rem; }
  #card ul { margin: 0; padding-left: 1.2rem; }
  #card .help { border: 3px solid #c00; border-radius: .5rem; padding: .25rem 1rem .75rem; margin-top: 1rem; }
  #card .help h2 { color: #c00; margin-top: .5rem; }
  #sources { padding-left: 1.2rem; }
  footer { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font-size: .85rem; color: #444; }
</style>
</head>
<body>
<div id="emergency" role="alert">
  In an emergency call
  <strong>999</strong>
</div>
<main>
  <form id="form">
    <label for="q">Ask about your medicines</label>
    <input id="q" autocomplete="off" maxlength="500">
  </form>
  <div id="answer" aria-live="polite"></div>
  <div id="card"></div>
  <ul id="sources"></ul>
</main>
<footer>Information from the NHS website, licensed under the Open Government Licence v3.0. Not medical advice. In an emergency call 999.</footer>
<script>
  const answer = document.getElementById("answer");
  const sources = document.getElementById("sources");
  const card = document.getElementById("card");
  document.getElementById("form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const question = document.getElementById("q").value;
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question }),
    });
    if (!res.ok) {
      answer.textContent = "Sorry, something went wrong. Please try again.";
      answer.className = "";
      sources.replaceChildren();
      card.replaceChildren();
      return;
    }
    const data = await res.json();
    answer.textContent = data.answer;
    answer.className = data.kind;
    // A section with no text shows no heading.
    const section = (title, items, cls = "") => {
      items = [].concat(items).filter((t) => t && t.trim());
      if (!items.length) return [];
      const el = document.createElement("section");
      el.className = cls;
      const h = document.createElement("h2");
      h.textContent = title;
      const ul = document.createElement("ul");
      ul.append(...items.map((t) => Object.assign(document.createElement("li"), { textContent: t })));
      el.append(h, ul);
      return [el];
    };
    card.replaceChildren(...(data.card ? [
      ...section("Summary", data.card.summary),
      ...section("What to do", data.card.what_to_do),
      ...section("Get help if", data.card.get_help_if, "help"),
    ] : []));
    sources.replaceChildren(...data.sources.map((s) => {
      const li = document.createElement("li");
      const a = document.createElement("a");
      a.href = s.url;
      a.textContent = `${s.medicine} > ${s.section}`;
      li.append(a);
      return li;
    }));
  });
</script>
</body>
</html>
